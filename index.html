<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSI HANZX — PREMIUM BYPASS & CHEATS</title>
    <style>
        @import url('https://googleapis.com');

        /* Configuración Global y Variables */
        :root {
            --neon-green: #00ff66;
            --neon-green-glow: rgba(0, 255, 102, 0.4);
            --neon-red: #ff3333;
            --neon-red-glow: rgba(255, 51, 51, 0.4);
            --bg-dark: #020604;
            --card-bg: rgba(4, 15, 8, 0.75);
            --text-main: #e0ffee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Lienzo de Lluvia Matrix */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }

        /* Contenedor de Contenido */
        .app-container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* HEADER PREMIUM CON EFECTO GLITCH */
        header {
            text-align: center;
            background: rgba(2, 10, 5, 0.85);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 255, 102, 0.05);
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            border-radius: 4px;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            animation: scanline-top 3s linear infinite;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: var(--neon-green);
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Tarjetas de Estadísticas */
        .stats-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed rgba(0, 255, 102, 0.4);
            padding: 15px 10px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: var(--neon-green);
            background: rgba(0, 255, 102, 0.03);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .stat-box .num {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-green);
        }

        .stat-box .label {
            font-size: 0.8rem;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SECCIÓN DE PRODUCTOS */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            border-left: 4px solid var(--neon-green);
            padding-left: 15px;
            text-shadow: 0 0 5px var(--neon-green-glow);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* DISEÑO DE TARJETA DE PRODUCTO */
        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 4px;
            padding: 30px 25px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-green);
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.15), 0 0 15px var(--neon-green-glow);
        }

        /* Esquinas estéticas decorativas estilo interfaz hacker */
        .product-card::before, .product-card::after {
            content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--neon-green); border-style: solid; opacity: 0; transition: opacity 0.3s;
        }
        .product-card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .product-card::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
        .product-card:hover::before, .product-card:hover::after { opacity: 1; }

        .product-meta {
            font-size: 0.85rem;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .product-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
        }

        .selectors-block {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 2px;
            border: 1px dashed rgba(0, 255, 102, 0.15);
            margin-bottom: 25px;
        }

        .control-group {
            margin-bottom: 12px;
        }
        .control-group:last-child { margin-bottom: 0; }

        .control-group label {
            display: block;
            font-size: 0.75rem;
            color: rgba(0, 255, 102, 0.7);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .custom-select {
            width: 100%;
            background: #040c06;
            border: 1px solid rgba(0, 255, 102, 0.4);
            color: var(--text-main);
            padding: 8px 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .custom-select:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green-glow);
        }

        /* Sección de Precio Activo */
        .price-display {
            margin-bottom: 25px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .price-display .currency-label {
            font-size: 0.9rem;
            color: rgba(0, 255, 102, 0.6);
        }
        .price-display .price-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        /* Botón de Inyección / Compra */
        .btn-action {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .btn-action:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
            font-weight: 900;
        }

        /* TARJETA PRÓXIMAMENTE (PRIME HOOK) */
        .product-card.locked {
            border-color: rgba(255, 51, 51, 0.3);
            background: rgba(15, 4, 4, 0.75);
        }
        .product-card.locked:hover {
            border-color: var(--neon-red);
            box-shadow: 0 10px 30px rgba(255, 51, 51, 0.15), 0 0 15px var(--neon-red-glow);
        }
        .product-card.locked::before, .product-card.locked::after { border-color: var(--neon-red); }
        .product-card.locked h3 { text-shadow: 0 0 8px rgba(255, 51, 51, 0.4); }
        .product-card.locked .product-meta { color: var(--neon-red); }
        .product-card.locked .price-amount { color: var(--neon-red); text-shadow: 0 0 10px rgba(255, 51, 51, 0.3); }
        
        .btn-locked {
            border-color: var(--neon-red);
            color: var(--neon-red);
            cursor: not-allowed;
        }
        .btn-locked:hover {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 15px var(--neon-red);
        }
